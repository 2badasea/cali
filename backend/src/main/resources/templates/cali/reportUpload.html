<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/single_layout}"
    xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/cali/reportUpload.css}" />
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="modal-view modal-body">

            <!-- 드래그앤드롭 업로드 영역 -->
            <div class="upload-drop-zone" id="uploadDropZone">
                <div class="upload-drop-inner">
                    <i class="bi bi-cloud-upload upload-icon"></i>
                    <p class="upload-hint">엑셀 파일을 드래그하거나 버튼을 클릭하세요</p>
                    <p class="upload-hint-sub">.xlsx, .xls 파일만 업로드 가능합니다</p>
                    <label class="btn btn-outline-primary btn-sm mt-2" for="reportUploadInput">
                        <i class="bi bi-folder2-open me-1"></i> 파일 선택
                    </label>
                    <!-- multiple: 여러 파일 선택 허용 -->
                    <input type="file" id="reportUploadInput" accept=".xlsx,.xls" multiple style="display:none;" />
                </div>
            </div>

            <!-- 선택된 파일 목록 (파일 선택 후 표시) -->
            <div id="selectedFileList" style="display:none;">
                <p class="file-list-title">선택된 파일 <span id="fileCount" class="badge bg-primary">0</span>개</p>
                <ul class="file-name-list" id="fileNameList"></ul>
            </div>

            <!-- 액션 버튼 영역 (파일 선택 후 표시) -->
            <div id="uploadActionBtns" style="display:none;" class="upload-action-area">
                <button type="button" class="btn btn-warning btn-sm btnUploadApproval">
                    <i class="bi bi-pen-fill me-1"></i> 결재
                </button>
                <button type="button" class="btn btn-primary btn-sm btnUploadOnly">
                    <i class="bi bi-upload me-1"></i> 업로드
                </button>
                <button type="button" class="btn btn-secondary btn-sm btnUploadCancel">
                    <i class="bi bi-x-lg me-1"></i> 취소
                </button>
            </div>

        </div>
    </div>
</body>

</html>
