<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/single_layout}"
    xmlns:th="http://www.thymeleaf.org">

<div layout:fragment="content">
    <p class="mb-3">
        <span class="badge badge-primary selectedCount" style="font-size: 1rem; padding: 6px 10px;">0</span>
        건의 대행성적서에 일괄 적용합니다.
        <br><small class="text-muted">입력하지 않은 항목은 변경되지 않습니다.</small>
    </p>

    <div class="form-group row">
        <label class="col-sm-3 col-form-label">대행의뢰처</label>
        <div class="col-sm-9">
            <input type="text" class="form-control agcyAgent" placeholder="변경 없으면 비워두세요">
        </div>
    </div>
    <div class="form-group row">
        <label class="col-sm-3 col-form-label">교정일자</label>
        <div class="col-sm-9">
            <input type="date" class="form-control caliDate">
        </div>
    </div>
    <div class="form-group row">
        <label class="col-sm-3 col-form-label">외부성적서번호</label>
        <div class="col-sm-9">
            <input type="text" class="form-control reportNum" placeholder="변경 없으면 비워두세요">
        </div>
    </div>
    <div class="form-group row">
        <label class="col-sm-3 col-form-label">진행상태</label>
        <div class="col-sm-9">
            <select class="form-control reportStatus">
                <option value="">변경 안 함</option>
                <option value="SUCCESS">완료</option>
                <option value="CANCEL">취소</option>
            </select>
        </div>
    </div>
</div>

</html>
