<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/layout}"
    xmlns:th="http://www.thymeleaf.org">

<body>
    <div layout:fragment="content">
        <div class="wrapper">
            <form class="searchForm mb-1" name="searchForm">
                <div class="d-flex flex-wrap align-items-center mb-1" style="gap: 4px;">

                    <!-- 좌측: 버튼 + 행 수 -->
                    <div class="d-flex align-items-center flex-wrap" style="gap: 4px;">

                        <!-- 성적서작업 드롭다운 (성적서작성 / 성적서업로드 / 성적서다중결재) -->
                        <div class="btn-group btn-group-sm">
                            <button type="button" class="btn btn-primary btn-sm dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                성적서작업
                            </button>
                            <div class="dropdown-menu">
                                <button type="button" class="dropdown-item btnWriteReport">성적서작성</button>
                                <button type="button" class="dropdown-item btnReportUpload">성적서업로드</button>
                                <div class="dropdown-divider"></div>
                                <button type="button" class="dropdown-item btnMultiApproval">성적서다중결재</button>
                            </div>
                        </div>

                        <!-- 기타 기능 버튼 -->
                        <button type="button" class="btn btn-secondary btn-sm btnWriteReset">비정상 종료 복구</button>
                        <button type="button" class="btn btn-warning btn-sm btnWaitChange">성적서대기변경</button>
                        <button type="button" class="btn btn-success btn-sm btnBulkEdit">통합수정</button>

                        <!-- 행 수 -->
                        <div class="input-group input-group-sm" style="width: auto;">
                            <div class="input-group-prepend">
                                <span class="input-group-text">행 수</span>
                            </div>
                            <select class="form-control form-control-sm rowLeng">
                                <option value="25" selected>25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                                <option value="200">200</option>
                            </select>
                        </div>
                    </div>

                    <!-- 우측: 검색필터 + 키워드 검색 (nowrap — 한 줄 유지) -->
                    <div class="ml-auto d-flex align-items-center" style="gap: 4px; flex-wrap: nowrap;">

                        <!-- 검색필터1: 진행상태 (report_status) -->
                        <div class="input-group input-group-sm" style="width: auto;">
                            <select class="form-control form-control-sm reportStatusFilter" style="width: 115px;">
                                <option value="" selected>진행상태</option>
                                <option value="NORMAL">기본</option>
                                <option value="REPAIR">수리</option>
                                <option value="IMPOSSIBLE">불가</option>
                                <option value="REJECTED">반려</option>
                                <option value="RESUBMITTED">재업로드</option>
                            </select>
                        </div>

                        <!-- 검색필터2: 결재상태 (work_status), 기본 "" → IDLE+READY+PROGRESS 표시 (FAIL/SUCCESS 제외) -->
                        <div class="input-group input-group-sm" style="width: auto;">
                            <select class="form-control form-control-sm workStatusFilter" style="width: 95px;">
                                <option value="" selected>결재상태</option>
                                <option value="READY">결재대기</option>
                                <option value="PROGRESS">결재진행중</option>
                                <option value="FAIL">결재실패</option>
                                <option value="SUCCESS">결재완료</option>
                            </select>
                        </div>

                        <!-- 검색필터3: 성적서작성 상태 (write_status) -->
                        <div class="input-group input-group-sm" style="width: auto;">
                            <select class="form-control form-control-sm writeStatusFilter" style="width: 95px;">
                                <option value="" selected>작성상태</option>
                                <option value="IDLE">미작성</option>
                                <option value="READY">작성대기</option>
                                <option value="PROGRESS">작성중</option>
                                <option value="SUCCESS">작성완료</option>
                                <option value="FAIL">작성실패</option>
                            </select>
                        </div>

                        <!-- 검색필터4: 접수구분 -->
                        <div class="input-group input-group-sm" style="width: auto;">
                            <select class="form-control form-control-sm orderTypeFilter" style="width: 95px;">
                                <option value="" selected>구분전체</option>
                                <option value="ACCREDDIT">공인</option>
                                <option value="UNACCREDDIT">비공인</option>
                                <option value="TESTING">시험</option>
                            </select>
                        </div>

                        <!-- 검색필터4: 중분류 / 소분류 (input-group-sm으로 높이 통일, select2 미사용) -->
                        <div class="input-group input-group-sm" style="width: auto;">
                            <select class="form-control form-control-sm middleCodeSelect" style="width: 145px;">
                                <option value="">중분류전체</option>
                            </select>
                        </div>
                        <div class="input-group input-group-sm" style="width: auto;">
                            <select class="form-control form-control-sm smallCodeSelect" style="width: 145px;">
                                <option value="">소분류전체</option>
                            </select>
                        </div>

                        <!-- 키워드 검색: form-control은 input-group 직접 자식으로 배치 (높이 통일) -->
                        <div class="input-group input-group-sm">
                            <select class="form-control form-control-sm searchType" name="searchType" style="width: 120px; margin-right: 5px;">
                                <option value="">전체선택</option>
                                <option value="reportNum">성적서번호</option>
                                <option value="custAgent">신청업체</option>
                                <option value="reportAgent">성적서발행처</option>
                                <option value="workMember">실무자</option>
                                <option value="approvalMember">기술책임자</option>
                                <option value="itemName">기기명</option>
                                <option value="itemFormat">형식</option>
                                <option value="itemMakeAgent">제작회사</option>
                                <option value="itemNum">기기번호</option>
                                <option value="manageNo">관리번호</option>
                            </select>
                            <input type="text" class="form-control form-control-sm" id="keyword" name="keyword" value="" style="width: 120px;" />
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>

                </div>
            </form>

            <div class="grid workApprovalList"></div>
        </div>
    </div>
</body>

</html>
