# ═══════════════════════════════════════════════════════════════
# frontend/nginx.conf
# Docker 컨테이너 내 Nginx 설정
#
# 라우팅 구조:
#   /admin/     → 정적 파일 서빙 (React SPA, vite base: "/admin/")
#   /api/       → backend 컨테이너로 프록시 (REST API)
#   /logout     → backend 컨테이너로 프록시 (Spring Security)
#   /           → backend 컨테이너로 프록시 (Thymeleaf SSR 페이지)
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    # ── React Admin SPA ─────────────────────────────────────────
    # vite.config.js의 base: "/admin/" 에 맞게 /admin/ 경로로 서빙
    # try_files: React Router 클라이언트 라우팅 지원 (새로고침 시 index.html 반환)
    location /admin/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ── API 프록시 ───────────────────────────────────────────────
    # Docker 내부 네트워크에서 서비스명 "backend"로 접근 가능
    location /api/ {
        proxy_pass             http://backend:8050;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     300s;
        proxy_connect_timeout  10s;
    }

    # ── Spring Security 처리 경로 ────────────────────────────────
    location /logout {
        proxy_pass           http://backend:8050;
        proxy_set_header     Host            $host;
        proxy_set_header     X-Real-IP       $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── SSR 페이지 및 기타 ───────────────────────────────────────
    location / {
        proxy_pass             http://backend:8050;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     300s;
        proxy_connect_timeout  10s;
    }
}