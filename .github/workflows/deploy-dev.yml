name: Deploy Dev (Home Server)

# ── 트리거 ────────────────────────────────────────────────────────
# workflow_dispatch: Actions 탭에서 수동으로만 실행
# → develop 브랜치에 기능 병합 완료 후 준비됐을 때만 배포
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "배포 사유 (예: 회원가입 기능 통합 테스트)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 홈서버: 코드 업데이트 및 Docker Compose 재배포 ──────────
      # 빌드는 서버 위에서 docker compose --build 로 수행
      # (멀티스테이지 Dockerfile이 Gradle + npm 빌드를 모두 처리)
      - name: Pull & deploy on home server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.HOME_HOST }}
          username: ${{ secrets.HOME_USER }}
          key:      ${{ secrets.HOME_SSH_KEY }}
          port:     ${{ secrets.HOME_PORT }}
          script: |
            set -e

            echo "▶ Deploy reason : ${{ github.event.inputs.reason }}"
            echo "▶ Triggered by  : ${{ github.actor }}"
            echo "▶ Target branch : develop"
            echo "▶ Commit SHA    : ${{ github.sha }}"

            # 1) 최신 코드 반영 (develop 브랜치 강제 동기화)
            cd /opt/cali/repo
            git fetch origin develop
            git reset --hard origin/develop

            # 2) 기존 컨테이너 중지 및 제거
            docker compose down

            # 3) 이미지 재빌드 후 백그라운드 실행
            #    BuildKit 캐시(~/.gradle, ~/.npm)를 활용하여 재빌드 시간 단축
            docker compose up -d --build

      # ── 헬스체크 ─────────────────────────────────────────────────
      # backend 컨테이너가 정상 기동될 때까지 최대 120초 대기
      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.HOME_HOST }}
          username: ${{ secrets.HOME_USER }}
          key:      ${{ secrets.HOME_SSH_KEY }}
          port:     ${{ secrets.HOME_PORT }}
          script: |
            set -e
            echo "Waiting for backend to start..."

            # 5초 간격 × 24회 = 최대 120초 대기
            for i in $(seq 1 24); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8050/actuator/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "✔ Health check passed (attempt $i)"
                exit 0
              fi
              echo "Attempt $i/24 — HTTP $STATUS, retrying in 5s..."
              sleep 5
            done

            # 120초 내 응답 없으면 실패 (docker compose logs 확인 필요)
            echo "✘ Health check failed"
            echo "  → 서버에서 'docker compose logs backend' 로 원인 확인"
            exit 1