# 워크플로우 이름 — GitHub Actions 탭에 표시되는 이름
name: Deploy Dev (Home Server)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# [트리거] 이 워크플로우를 언제 실행할지 정의
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
on:
  # workflow_dispatch: push/PR 자동 트리거가 아닌, 사람이 직접 Actions 탭에서 "Run workflow" 버튼을 눌러야 실행됨
  # → 의도치 않은 자동 배포를 방지하고, develop 브랜치에 기능 병합이 완료된 뒤 수동으로만 배포
  workflow_dispatch:
    inputs:
      # 배포 실행 시 입력받는 파라미터 — Actions 탭 UI에 입력창으로 표시됨
      reason:
        description: "배포 사유 (예: 회원가입 기능 통합 테스트)"
        required: false   # 필수 입력 아님 (비워도 실행 가능)
        default: ""       # 입력 없을 때 기본값 (빈 문자열)

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# [환경 변수] 워크플로우 전체에서 공통으로 사용하는 환경 변수
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
env:
  # GitHub Actions가 내부적으로 사용하는 JS 기반 액션들을 Node.js 24로 강제 실행
  # → 구버전 Node(16/20) 지원 종료에 따른 deprecation 경고 방지용 임시 플래그
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# [잡(Job) 정의] 실제로 실행할 작업 단위
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
jobs:
  deploy:
    # GitHub이 제공하는 클라우드 러너(무료 ubuntu VM)에서 이 잡을 실행
    # 참고: 실제 배포 코드는 SSH로 홈서버에 원격 실행되므로, 러너는 "SSH 중계" 역할만 함
    runs-on: ubuntu-latest

    steps:
      # ── STEP 1: 홈서버 — 코드 업데이트 및 Docker Compose 재배포 ──
      # 빌드(Gradle + npm)는 홈서버 위에서 docker compose --build 로 수행
      # (멀티스테이지 Dockerfile이 Gradle 빌드와 npm 빌드를 단계별로 처리)
      - name: Pull & deploy on home server
        # appleboy/ssh-action: 원격 서버에 SSH 접속하여 script 블록의 명령을 실행해주는 서드파티 액션
        uses: appleboy/ssh-action@v1.0.3
        with:
          # GitHub Secrets에 저장된 홈서버 접속 정보 (Settings > Secrets and variables > Actions)
          host:     ${{ secrets.HOME_HOST }}      # 서버 IP 또는 도메인
          username: ${{ secrets.HOME_USER }}      # SSH 접속 계정명
          key:      ${{ secrets.HOME_SSH_KEY }}   # SSH 개인키 (PEM 형식)
          port:     ${{ secrets.HOME_PORT }}      # SSH 포트 (기본 22, 변경했을 경우 명시)
          # | (파이프) 이후의 멀티라인 문자열이 SSH로 원격 서버에서 실행될 셸 스크립트
          script: |
            # set -e: 이후 명령 중 하나라도 실패(exit code != 0)하면 스크립트 즉시 중단
            # → 중간 단계가 실패했는데 다음 단계가 계속 실행되는 사고를 방지
            set -e

            # 배포 메타 정보 출력 — Actions 로그에서 이번 배포의 컨텍스트를 확인하기 위함
            echo "▶ Deploy reason : ${{ github.event.inputs.reason }}"  # 사용자가 입력한 배포 사유
            echo "▶ Triggered by  : ${{ github.actor }}"                # 배포를 실행한 GitHub 계정명
            echo "▶ Target branch : develop"                            # 배포 대상 브랜치 (항상 develop)
            echo "▶ Commit SHA    : ${{ github.sha }}"                  # 배포 시점의 커밋 해시

            # 1) 최신 코드 반영 (develop 브랜치 강제 동기화)
            cd /opt/cali/repo                   # 서버의 git 저장소 경로로 이동
            git fetch origin develop            # 원격 develop 브랜치의 최신 커밋 정보를 로컬로 가져옴 (체크아웃은 아직 아님)
            git reset --hard origin/develop     # 로컬 상태를 원격 develop 브랜치와 완전히 동일하게 강제 덮어씀
                                                # (로컬 변경사항/커밋 모두 버림 — 서버에서 직접 수정하면 날아가므로 주의)

            # 2) 기존 컨테이너 중지 및 제거
            docker compose down                 # docker-compose.yml에 정의된 모든 컨테이너와 네트워크를 중지 후 삭제
                                                # (볼륨은 기본적으로 유지됨 — DB 데이터 보존)

            # 3) 이미지 재빌드 후 백그라운드 실행
            #    서버에 캐시된 Gradle/npm 의존성을 재활용하여 재빌드 시간 단축
            docker compose up -d --build        # --build: 컨테이너 시작 전 Dockerfile 기준으로 이미지 새로 빌드
                                                # -d (detach): 컨테이너를 백그라운드에서 실행하고 터미널 반환

      # ── STEP 2: 헬스체크 — backend 컨테이너 정상 기동 확인 ───────
      # docker compose up이 반환됐다고 앱이 바로 준비된 것은 아님
      # Spring Boot 기동(JVM 워밍업, DB 연결, 빈 초기화)에 수십 초 소요될 수 있으므로 별도 확인
      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.HOME_HOST }}
          username: ${{ secrets.HOME_USER }}
          key:      ${{ secrets.HOME_SSH_KEY }}
          port:     ${{ secrets.HOME_PORT }}
          script: |
            set -e
            echo "Waiting for backend to start..."

            # seq 1 24: 1~24 숫자 시퀀스 생성 → 5초 × 24회 = 최대 120초 대기
            for i in $(seq 1 24); do
              # curl 옵션 설명:
              #   -s           : silent 모드 — 진행률/에러 메시지 숨김
              #   -o /dev/null : 응답 body는 버림 (HTTP 상태코드만 필요)
              #   -w "%{http_code}" : 응답 완료 후 HTTP 상태코드만 출력 (예: 200, 503)
              #   || true      : curl 자체가 실패(연결 거부 등)해도 exit code 0으로 처리
              #                  → set -e에 의한 스크립트 중단 방지 (아직 기동 중일 수 있으므로)
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8050/actuator/health || true)

              # Spring Boot Actuator /health 엔드포인트가 200을 반환하면 앱 정상 기동 완료
              if [ "$STATUS" = "200" ]; then
                echo "✔ Health check passed (attempt $i)"
                exit 0   # 성공으로 스크립트 종료 (잡 성공 처리)
              fi

              echo "Attempt $i/24 — HTTP $STATUS, retrying in 5s..."
              sleep 5    # 5초 대기 후 재시도
            done

            # 24회(120초) 동안 200을 받지 못하면 배포 실패로 처리
            echo "✘ Health check failed"
            echo "  → 서버에서 'docker compose logs backend' 로 원인 확인"
            exit 1       # exit code 1 반환 → GitHub Actions 잡 실패로 표시